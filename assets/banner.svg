<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- CSS Keyframes for dynamic animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-360px); }
        100% { transform: translateY(360px); }
      }
      .glow-orb-1 {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 250px 120px;
      }
      .glow-orb-2 {
        animation: pulseGlow 8s ease-in-out infinite alternate;
        transform-origin: 950px 240px;
      }
      .floating-node {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 8 16;
        animation: flowData 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Dynamic Background Ambient Glow Orbs -->
  <g>
    <circle class="glow-orb-1" cx="250" cy="120" r="160" fill="url(#glowPulse)" filter="url(#neonGlow)" />
    <circle class="glow-orb-2" cx="950" cy="240" r="180" fill="url(#glowPulse)" filter="url(#neonGlow)" />
  </g>

  <!-- Subdued Grid & Circuit Lines (Background) -->
  <g opacity="0.16">
    <path d="M 0 60 H 1200 M 0 120 H 1200 M 0 180 H 1200 M 0 240 H 1200 M 0 300 H 1200" stroke="#38bdf8" stroke-width="0.75" />
    <path d="M 120 0 V 360 M 240 0 V 360 M 360 0 V 360 M 480 0 V 360 M 600 0 V 360 M 720 0 V 360 M 840 0 V 360 M 960 0 V 360 M 1080 0 V 360" stroke="#38bdf8" stroke-width="0.75" />
  </g>

  <!-- Dynamic Data Flow Circuit Lines -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 180 Q 250 80 450 180 T 850 180 T 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 80 260 Q 300 320 600 240 T 1120 260" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Floating AI / GPU Architectural Nodes in background (Kept away from center text) -->
  <g class="floating-node" opacity="0.45">
    <!-- Left GPU Chip Node -->
    <g transform="translate(60, 45)">
      <rect width="64" height="64" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="32" y="38" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">GPU</text>
      <circle cx="8" cy="8" r="2.5" fill="#38bdf8" />
      <circle cx="56" cy="8" r="2.5" fill="#38bdf8" />
      <circle cx="8" cy="56" r="2.5" fill="#38bdf8" />
      <circle cx="56" cy="56" r="2.5" fill="#38bdf8" />
    </g>
    <!-- Right Container / Pod Node -->
    <g transform="translate(1070, 240)">
      <rect width="64" height="64" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <text x="32" y="38" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">POD</text>
      <circle cx="8" cy="8" r="2.5" fill="#c084fc" />
      <circle cx="56" cy="8" r="2.5" fill="#c084fc" />
      <circle cx="8" cy="56" r="2.5" fill="#c084fc" />
      <circle cx="56" cy="56" r="2.5" fill="#c084fc" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Strictly high-contrast, crystal clear typography -->

  <!-- Top Badge Category -->
  <g transform="translate(600, 70)" filter="url(#textShadow)">
    <rect x="-140" y="-18" width="280" height="32" rx="16" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.2" />
    <circle cx="-116" cy="-2" r="5" fill="#10b981" />
    <text x="-98" y="3" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="152" text-anchor="middle" font-size="38" font-weight="800" fill="url(#textGrad)" filter="url(#textShadow)" letter-spacing="-0.5">
    Awesome Serverless GPU &amp; AI Compute
  </text>

  <!-- High-Contrast Subtitle -->
  <text x="600" y="196" text-anchor="middle" font-size="16" font-weight="500" fill="#f8fafc" filter="url(#textShadow)" opacity="0.95">
    High-Performance Serverless Runtimes, Inference Engines, BYO-Containers &amp; Scale-to-Zero Cloud GPUs
  </text>

  <!-- Interactive / Informational Feature Badges (Pills) -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <!-- Pill 1: Scale to Zero -->
    <g transform="translate(-340, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="600">⚡ Scale-to-Zero</text>
    </g>
    <!-- Pill 2: Per-Second Billing -->
    <g transform="translate(-115, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="8" fill="#111827" stroke="#818cf8" stroke-width="1.2" />
      <text x="0" y="5" fill="#a5b4fc" font-size="12" font-weight="600">⏱️ Per-Second Billing</text>
    </g>
    <!-- Pill 3: Sub-Second Cold Starts -->
    <g transform="translate(120, 0)">
      <rect x="-105" y="-16" width="210" height="32" rx="8" fill="#111827" stroke="#c084fc" stroke-width="1.2" />
      <text x="0" y="5" fill="#e879f9" font-size="12" font-weight="600">🚀 Sub-Second Cold Starts</text>
    </g>
    <!-- Pill 4: Open-Source First -->
    <g transform="translate(345, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="5" fill="#34d399" font-size="12" font-weight="600">🔓 Open-Source Runtimes</text>
    </g>
  </g>

  <!-- Bottom Accent Border Glow -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#textGrad)" />
</svg>
